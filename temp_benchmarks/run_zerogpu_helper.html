<!doctype html><meta charset="utf-8"><title>ShotB ZeroGPU helper</title><pre id="log">Starting…</pre><div id="out"></div><script>
const BASE='https://upsampler-wan-2-2-14b-image-to-video.hf.space';
const IMG='https://raw.githubusercontent.com/msrida91-sudo/AIComicBuilder/temp-shotb-hf-zerogpu-20261019/temp_benchmarks/shotb_zerogpu_input.jpg';
const PROMPT=`Locked-off cinematic 2D dark fantasy interrogation room. Preserve the exact characters, faces, ages, costumes, cane, chair, table, stone room, amber lantern lighting, framing, and hand-drawn cel-animation look of the source image. Vael, the gaunt middle-aged man on the left, shifts his weight onto the cane before moving, reaches back with his free hand for the chair, briefly hesitates from pain, then begins a slow controlled asymmetric descent toward sitting. His hips move backward and down in an arc, knees flex naturally, torso counterbalances forward, coat and sleeves trail slightly. Serin, the restrained young man at the table, remains mostly still and watches with subtle fear; only tiny eye movement and shallow breathing. Korr, the large bald guard in the rear, remains almost unnaturally still. Very subtle lantern flicker. Camera completely locked: no zoom, pan, shake, or reframing. Restrained acting, grounded weight, stable linework, painterly background, fine cel-shaded character drawing.`;
const log=(x)=>{document.getElementById('log').textContent += '\n'+x; console.log(x)};
(async()=>{try{
 log('Fetching source image'); const r=await fetch(IMG); if(!r.ok) throw new Error('image '+r.status); const blob=await r.blob(); log('Image bytes '+blob.size);
 log('Uploading to Gradio'); const fd=new FormData(); fd.append('files',blob,'shotb.jpg'); const ur=await fetch(BASE+'/gradio_api/upload',{method:'POST',body:fd}); const ut=await ur.text(); log('upload '+ur.status+' '+ut); if(!ur.ok) throw new Error('upload failed'); const uj=JSON.parse(ut); const path=Array.isArray(uj)?uj[0]:(uj.files?uj.files[0]:uj.path); if(!path) throw new Error('no upload path');
 let api='generate_video'; try { const ir=await fetch(BASE+'/gradio_api/info'); const ij=await ir.json(); log('API names '+Object.keys(ij.named_endpoints||{}).join(',')); const ks=Object.keys(ij.named_endpoints||{}); const k=ks.find(x=>x.includes('generate_video'))||ks[0]; if(k) api=k.replace(/^\//,''); } catch(e){log('info warning '+e)}
 const fileData={path:path,orig_name:'shotb.jpg',size:blob.size,mime_type:'image/jpeg',meta:{_type:'gradio.FileData'}};
 const payload={data:[fileData,PROMPT,4.0,4,20261019,false]}; log('Calling /'+api+' with seed 20261019');
 const cr=await fetch(BASE+'/gradio_api/call/'+api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); const ct=await cr.text(); log('call '+cr.status+' '+ct); if(!cr.ok) throw new Error('call failed'); const cj=JSON.parse(ct); const eid=cj.event_id; if(!eid) throw new Error('no event_id');
 log('Waiting event '+eid); const er=await fetch(BASE+'/gradio_api/call/'+api+'/'+eid); const et=await er.text(); log('event response received '+er.status+' chars='+et.length); document.body.insertAdjacentHTML('beforeend','<textarea style="width:100%;height:220px">'+et.replaceAll('&','&amp;').replaceAll('<','&lt;')+'</textarea>');
 let data=null; for(const block of et.split('\n\n')){ if(block.includes('event: complete')){ const line=block.split('\n').find(x=>x.startsWith('data:')); if(line){data=JSON.parse(line.slice(5).trim());}} }
 if(!data) throw new Error('No complete data in SSE'); log('COMPLETE '+JSON.stringify(data)); const v=Array.isArray(data)?data[0]:data; const url=(v&&v.url)|| (v&&v.path?BASE+'/gradio_api/file='+encodeURIComponent(v.path):null); if(!url) throw new Error('No video URL'); document.getElementById('out').innerHTML='<h2>DONE</h2><a id="videoLink" href="'+url+'">VIDEO RESULT</a><video controls style="max-width:900px;display:block" src="'+url+'"></video>'; log('VIDEO_URL '+url);
}catch(e){log('ERROR '+(e.stack||e));}})();
</script>
