async function run(){try{log('Starting LTX Shot B benchmark');let r=await fetch(SRC);let b=await r.blob();log('source '+r.status+' bytes='+b.size);if(!r.ok)throw Error('source fetch failed');const fd=new FormData();fd.append('files',b,'shotb.jpg');r=await fetch(SPACE+'/gradio_api/upload',{method:'POST',body:fd});let t=await r.text();log('upload '+r.status+' '+t.slice(0,400));if(!r.ok)throw Error('upload failed');const fp=JSON.parse(t)[0];const data=[PROMPT,NEG,fp,null,576,1024,'image-to-video',3.0,9,20261019,false,3.0,true];log('calling /image_to_video 576x1024, 3.0s, seed 20261019, fixed seed, CFG 3.0, improve_texture=true');r=await fetch(SPACE+'/gradio_api/call/image_to_video',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data})});t=await r.text();log('call '+r.status+' '+t.slice(0,600));if(!r.ok)throw Error('call failed');const eid=JSON.parse(t).event_id;log('event_id '+eid);r=await fetch(SPACE+'/gradio_api/call/image_to_video/'+eid);const s=await r.text();log('event status '+r.status+' chars='+s.length);log(s.slice(-8000));const lines=s.split(/\r?\n/);let event=null,last=null;for(const line of lines){if(line.startsWith('event:'))event=line.slice(6).trim();if(line.startsWith('data:')){try{last=JSON.parse(line.slice(5).trim())}catch(e){}}}if(event==='error'||last===null)throw Error('No complete data in SSE; final event='+event);log('FINAL_DATA '+JSON.stringify(last));function find(x){if(typeof x==='string'&&x.includes('.mp4'))return x;if(Array.isArray(x)){for(const y of x){const z=find(y);if(z)return z}}if(x&&typeof x==='object'){for(const y of Object.values(x)){const z=find(y);if(z)return z}}return null}let u=find(last);if(u){if(u.startsWith('/'))u=SPACE+u;if(!u.startsWith('http')&&u.includes('/tmp/'))u=SPACE+'/gradio_api/file='+encodeURIComponent(u);log('VIDEO_URL '+u);out.innerHTML='<a id="video" href="'+u+'">VIDEO RESULT</a><br><video controls style="max-width:100%;margin-top:10px" src="'+u+'"></video>'}else log('DONE but no m
